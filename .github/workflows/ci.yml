name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    name: Backend syntax and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Byte compile every backend module
        run: python -m compileall -q backend/app
      - name: Lint
        run: |
          pip install --quiet ruff
          ruff check backend/app --select E9,F63,F7,F82
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
